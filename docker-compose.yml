services:
  agrishield-api:
    build:
      context: .
      dockerfile: Dockerfile
    env_file:
      - .env
    ports:
      - "${AGRISHIELD_PORT:-8000}:${AGRISHIELD_PORT:-8000}"
    volumes:
      - agrishield-data:/data
    restart: unless-stopped
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import os, urllib.request; urllib.request.urlopen('http://127.0.0.1:' + os.environ.get('AGRISHIELD_PORT', '8000') + '/v1/health', timeout=4)"
      interval: 30s
      timeout: 5s
      start_period: 60s
      retries: 3

volumes:
  agrishield-data:
